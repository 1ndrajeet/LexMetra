  # -----------------------------------------------------------------------
  # FOURTH SCHEDULE — Exceptions to Rule 12(2)
  # -----------------------------------------------------------------------
  fourthSchedule:
    title: "Exceptions to Rule 12(2)"
    reference: "Rule 12(2), Fourth Schedule"
    exceptions:
      - commodity: "Aerosol products"
        allowed: ["weight", "volume", "weightAndVolume"]
      - commodity: "Acids in liquid form"
        allowed: ["weight", "volume"]
      - commodity: "Compressed or liquefied air (not LPG)"
        allowed: ["volumeAtStatedTempPressure"]
      - commodity: "Curd"
        allowed: ["weight", "equivalentVolume"]
      - commodity: "Electric cables"
        allowed: ["length", "weight"]
      - commodity: "Electric wire"
        allowed: ["length", "weight"]
      - commodity: "Fencing wire"
        allowed: ["length", "weight"]
      - commodity: "Fruits, all kinds"
        allowed: ["number", "weight"]
      - commodity: "Furnace oil"
        allowed: ["weight", "volume"]
      - commodity: "Non-edible vegetable oil"
        allowed: ["weight", "volume"]
      - commodity: "Edible oil, Vanaspati ghee, Butter oil"
        allowed: ["weight", "volume"]
      - commodity: "Heavy residual fuel oil"
        allowed: ["weight", "volume"]
      - commodity: "Industrial diesel fuel"
        allowed: ["weight", "volume"]
      - commodity: "Honey, malt extract, golden syrup, treacle"
        allowed: ["weight"]
      - commodity: "Ice cream and similar frozen products"
        allowed: ["volume"]
      - commodity: "Liquid chemicals"
        allowed: ["weight", "volume"]
      - commodity: "Liquefied petroleum gas"
        allowed: ["weight"]
      - commodity: "Nails, wood screws"
        allowed: ["number", "weight"]
      - commodity: "Paints (other than paste/solid paint), varnish, varnish stains, enamels"
        allowed: ["volume"]
      - commodity: "Paste paint, solid paint"
        allowed: ["weight"]
      - commodity: "Rasgulla, Gulab jamun and other sweet preparations"
        allowed: ["weight"]
      - commodity: "Ready-made garments"
        allowed: ["number"]
      - commodity: "Sauces, all kinds"
        allowed: ["weight"]
      - commodity: "Tyres and tubes"
        allowed: ["number"]
      - commodity: "Yarn"
        allowed: ["weight", "length"]
      - commodity: "Cosmetics including creams, shampoo, lotions and perfumes"
        allowed: ["weight", "volume"]

