# =========================================================================
# LEXMETRA — Legal Metrology (Packaged Commodities) Rules, 2011
# Comprehensive deterministic rule set
# =========================================================================
#
# Source:     Ministry of Consumer Affairs, Food and Public Distribution
#             (Department of Consumer Affairs), Government of India
#             G.S.R. 202(E), dated 7th March, 2011
#             as amended up to latest available consolidation
#
# Legal Status: Authoritative statutory text for compliance evaluation
# Engine Contract: PASS / FAIL / UNCERTAIN / NOT_APPLICABLE / EXEMPT
# =========================================================================

metadata:
  rulesetId: "LMPC-2011"
  rulesetVersion: "2011.1.0"
  effectiveFrom: "2011-04-01"
  effectiveTo: null
  jurisdiction: "IN"
  authority: "Department of Consumer Affairs, Government of India"
  legalInstrument: "Legal Metrology (Packaged Commodities) Rules, 2011"
  legalCitation: "G.S.R. 202(E), 7th March 2011"
  companionAct: "Legal Metrology Act, 2009 (Act 1 of 2010)"
  supersedes: "Standards of Weights and Measures (Packaged Commodities) Rules, 1977"
  sourceDocument: "https://consumeraffairs.gov.in/"
  notes: |
    Authoritative baseline ruleset. Amendments after the notified date
    must be captured as new ruleset versions with new rulesetVersion and
    effectiveFrom values. Historical inspections remain pinned to the
    ruleset version active on their inspectionDate.

# =========================================================================
# GLOBAL CONFIGURATION
# =========================================================================

config:
  # Confidence threshold below which a present field is treated as
  # weak evidence and downgraded from PASS to UNCERTAIN.
  minEvidenceConfidence: 0.75

  # Declarations must be in Hindi (Devanagari) or English; other
  # languages may be used in addition (Rule 9(4)).
  recognisedLanguages: ["hi", "en"]

  currency: "INR"

  siUnitSymbols:
    mass:    ["g", "kg", "mg"]
    volume:  ["ml", "l", "cl"]
    length:  ["mm", "cm", "m"]
    area:    ["cm2", "dm2", "m2"]
    number:  ["N", "U"]

  dateFields:
    - manufacturedDate
    - packedDate
    - importedDate
    - expiryDate
    - bestBeforeDate

  numericFields:
    - mrp
    - netQuantityValue
    - retailSalePrice
    - unitSalePrice

# =========================================================================
# REUSABLE DEFINITIONS
# =========================================================================

definitions:
  productCategories:
    food:            { label: "Food commodity (FSSAI-covered)" }
    drug:            { label: "Drug / pharmaceutical formulation" }
    cosmetic:        { label: "Cosmetic or personal-care product" }
    medicalDevice:   { label: "Medical device" }
    household:       { label: "Household / non-food consumable" }
    agricultural:    { label: "Agricultural input" }
    industrial:      { label: "Industrial / commercial input" }
    other:           { label: "Uncategorised" }

  roles:
    manufacturer: { label: "Manufacturer" }
    packer:       { label: "Packer" }
    importer:     { label: "Importer" }
    marketer:     { label: "Marketer" }

  saleTypes:
    retail:        { label: "Retail sale to consumer" }
    wholesale:     { label: "Wholesale (Rule 24)" }
    ecommerce:     { label: "E-commerce listing" }
    export:        { label: "Export (Rule 25)" }
    industrial:    { label: "Direct to industrial consumer" }
    institutional: { label: "Direct to institutional consumer" }

  verificationOutcomes:
    - VALID
    - INVALID
    - UNVERIFIED
    - API_UNAVAILABLE
    - MALFORMED

# =========================================================================
# APPLICABILITY (Rule 3 and Rule 26)
# =========================================================================

applicability:

  - id: "APL-R3-CHAPTER-II-SCOPE"
    ruleReference: "Rule 3"
    description: |
      Chapter II (retail-sale declarations) does not apply to packages
      containing more than 25 kg or 25 litres (excluding cement and
      fertiliser sold in bags up to 50 kg), nor to packaged commodities
      meant for industrial or institutional consumers.
    logic:
      anyOf:
        - quantityExceeds: { value: 25, unit: "kg" }
        - quantityExceeds: { value: 25, unit: "l" }
        - saleType: "industrial"
        - saleType: "institutional"
      withExceptions:
        - id: "APL-R3-CEMENT"
          condition:
            commodityTypeMatches: ["cement"]
            quantityAtMost: { value: 50, unit: "kg" }
        - id: "APL-R3-FERTILISER"
          condition:
            commodityTypeMatches: ["fertiliser", "fertilizer"]
            quantityAtMost: { value: 50, unit: "kg" }
    outcomeWhenApplicable: APPLICABLE
    outcomeWhenNot: NOT_APPLICABLE

  - id: "APL-R26-A-SMALL-PACK"
    ruleReference: "Rule 26(a)"
    description: |
      Exemption for packages of net weight or measure not exceeding
      10g or 10ml. Between 10g–20g (10ml–20ml), only MRP and net
      quantity declarations are required.
    logic:
      anyOf:
        - quantityAtMost: { value: 10, unit: "g" }
        - quantityAtMost: { value: 10, unit: "ml" }
    outcome: EXEMPT
    partialRequirementBand:
      min: { value: 10, unit: "g_or_ml" }
      max: { value: 20, unit: "g_or_ml" }
      requiredFields: ["mrp", "netQuantity", "netQuantityUnit"]

  - id: "APL-R26-B-FAST-FOOD"
    ruleReference: "Rule 26(b)"
    description: "Fast-food packages packed by restaurant or hotel are exempt."
    logic:
      allOf:
        - productCategory: "food"
        - packedByEstablishmentType: ["restaurant", "hotel", "quick_service"]
    outcome: EXEMPT

  - id: "APL-R26-C-DPCO"
    ruleReference: "Rule 26(c)"
    description: |
      Scheduled and non-scheduled formulations covered under the Drugs
      (Price Control) Order, 1995 are exempt.
    logic:
      allOf:
        - productCategory: "drug"
        - coveredByDpco: true
    outcome: EXEMPT

  - id: "APL-R26-D-AGRI-BULK"
    ruleReference: "Rule 26(d)"
    description: "Agricultural farm produce in packages above 50 kg is exempt."
    logic:
      allOf:
        - commodityTypeMatches: ["agriculturalFarmProduce"]
        - quantityExceeds: { value: 50, unit: "kg" }
    outcome: EXEMPT

# =========================================================================
# RULES
# =========================================================================
#
# Rule schema (v2):
#   id              — stable identifier
#   ruleReference   — human-readable legal citation
#   version         — rule version within this ruleset
#   title           — short summary
#   description     — full explanation
#   appliesWhen     — context predicate
#   exemptWhen      — exemption predicate (overrides applies)
#   requires        — required evidence fields
#   validations     — list of validation specs (validation DSL)
#   severity        — informational | minor | major | critical
#   reviewPolicy    — never | onUncertain | onFail | always
#   notes           — reviewer guidance
#   tags            — for filtering/grouping

rules:

  # =======================================================================
  # RULE 6 — Mandatory Declarations
  # =======================================================================

  - id: "R6-1-A-MANUFACTURER"
    ruleReference: "Rule 6(1)(a)"
    version: "2011.1"
    title: "Manufacturer / Packer / Importer name and full address"
    description: |
      Every retail package must bear the name and complete address of the
      manufacturer, or where the manufacturer is not the packer, both
      manufacturer and packer; imported packages must bear the importer.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
      productCategory: "any"
    exemptWhen:
      applicabilityId: "APL-R26-A-SMALL-PACK"
    requires:
      anyOf:
        - field: "manufacturer"
          companionField: "manufacturerAddress"
        - allOf:
            - field: "manufacturer"
            - field: "packer"
            - field: "packerAddress"
        - allOf:
            - field: "importer"
            - field: "importerAddress"
    validations:
      - id: "V-NAME-PRESENT"
        type: "presence"
        fields: ["manufacturer|packer|importer"]
        failAction: FAIL
      - id: "V-ADDRESS-PRESENT"
        type: "presence"
        fields: ["manufacturerAddress|packerAddress|importerAddress"]
        failAction: FAIL
      - id: "V-ADDRESS-COMPLETENESS"
        type: "compositeAddress"
        requiresComponents: ["cityOrDistrict", "stateOrUt"]
        optionalComponents: ["street", "premisesNumber", "pinCode"]
        onMissingCritical: UNCERTAIN
    severity: critical
    reviewPolicy: onUncertain
    notes: |
      Rule 10 sets out what "complete address" means. Explanation I to
      Rule 6(1)(a) says a bare company name without a qualifying phrase
      ("manufactured by", "packed by") is presumed to be the
      manufacturer's — leave that legal inference to the reviewer.

  - id: "R6-1-B-COMMON-NAME"
    ruleReference: "Rule 6(1)(b)"
    version: "2011.1"
    title: "Common or generic name of the commodity"
    description: |
      The common or generic name of the commodity must be declared. For
      packages with more than one product, the name and number or
      quantity of each product must be stated.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
      productCategory: "any"
    exemptWhen:
      applicabilityId: "APL-R26-A-SMALL-PACK"
    requires:
      field: "genericName|commonName|productName"
    validations:
      - id: "V-COMMON-NAME-PRESENT"
        type: "presence"
        fields: ["genericName|commonName|productName"]
        failAction: FAIL
      - id: "V-COMMON-NAME-NOT-BRAND"
        type: "notEqual"
        field: "genericName"
        forbiddenMatches: ["brand", "productName"]
        failAction: UNCERTAIN
        note: "Product name is not the same as generic name."
    severity: major
    reviewPolicy: onUncertain

  - id: "R6-1-C-NET-QUANTITY"
    ruleReference: "Rule 6(1)(c)"
    version: "2011.1"
    title: "Net quantity declaration"
    description: |
      The net quantity in terms of the standard unit of weight, measure
      or number must be declared.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
      productCategory: "any"
    requires:
      allOf:
        - field: "netQuantityValue"
        - field: "netQuantityUnit"
    validations:
      - id: "V-NET-QTY-PRESENT"
        type: "presence"
        fields: ["netQuantityValue", "netQuantityUnit"]
        failAction: FAIL
      - id: "V-NET-QTY-POSITIVE"
        type: "numericPositive"
        field: "netQuantityValue"
        failAction: FAIL
      - id: "V-NET-UNIT"
        type: "unitMembership"
        field: "netQuantityUnit"
        allowedUnits:
          mass:   ["g", "kg", "mg"]
          volume: ["ml", "l"]
          length: ["mm", "cm", "m"]
          area:   ["cm2", "dm2", "m2"]
          number: ["N", "U"]
        failAction: FAIL
      - id: "V-NET-QTY-DECLARATION-MANNER"
        type: "forbiddenSubstring"
        field: "netQuantityRawText"
        caseInsensitive: true
        forbidden:
          - "minimum"
          - "not less than"
          - "average"
          - "about"
          - "approximately"
          - "approx"
        failAction: FAIL
    severity: critical
    reviewPolicy: onUncertain

  - id: "R6-1-D-MANUFACTURE-DATE"
    ruleReference: "Rule 6(1)(d)"
    version: "2011.1"
    title: "Month and year of manufacture / packing / import"
    description: |
      The month and year in which the commodity was manufactured,
      pre-packed or imported must be declared.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
      productCategory: "any"
    exemptWhen:
      anyOf:
        - applicabilityId: "APL-R26-A-SMALL-PACK"
        - commodityTypeMatches: ["bidi", "incenseSticks"]
        - specialCase: "domesticLpgCylinder14_2kg"
        - specialCase: "domesticLpgCylinder5kg"
    requires:
      anyOf:
        - field: "manufacturedDate"
        - field: "packedDate"
        - field: "importedDate"
    validations:
      - id: "V-DATE-PRESENT"
        type: "presence"
        fields: ["manufacturedDate|packedDate|importedDate"]
        failAction: FAIL
      - id: "V-DATE-VALID"
        type: "dateIso"
        fields: ["manufacturedDate|packedDate|importedDate"]
        failAction: UNCERTAIN
      - id: "V-DATE-NOT-FUTURE"
        type: "dateNotAfter"
        field: "manufacturedDate|packedDate|importedDate"
        compareTo: "inspectionDate"
        failAction: UNCERTAIN
    severity: major
    reviewPolicy: onUncertain

  - id: "R6-1-E-RETAIL-PRICE"
    ruleReference: "Rule 6(1)(e)"
    version: "2011.1"
    title: "Retail sale price (MRP) declaration"
    description: |
      The retail sale price (Maximum Retail Price, inclusive of all
      taxes) must be declared in the prescribed form.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
      productCategory: "any"
    exemptWhen:
      anyOf:
        - applicabilityId: "APL-R26-A-SMALL-PACK"
        - commodityTypeMatches: ["bidi"]
        - specialCase: "domesticLpgCylinderAdministrativePrice"
    requires:
      field: "mrp"
    validations:
      - id: "V-MRP-PRESENT"
        type: "presence"
        field: "mrp"
        failAction: FAIL
      - id: "V-MRP-POSITIVE"
        type: "numericPositive"
        field: "mrp"
        failAction: FAIL
      - id: "V-MRP-FORMAT"
        type: "regex"
        field: "mrpRawText"
        pattern: "(?i)\\b(mrp|maximum\\s+retail|max\\.?\\s*retail)\\b"
        failAction: UNCERTAIN
        severityOverride: minor
    severity: critical
    reviewPolicy: onUncertain

  - id: "R6-1-F-DIMENSIONS"
    ruleReference: "Rule 6(1)(f)"
    version: "2011.1"
    title: "Dimensions of commodity where relevant"
    description: |
      Where the sizes of the commodity are relevant, dimensions must be
      declared. If different pieces have different dimensions, each
      piece's dimensions must be stated.
    appliesWhen:
      commodityTypeIn:
        - "bedSheet"
        - "hemmedFabric"
        - "dhoti"
        - "saree"
        - "napkin"
        - "pillowCover"
        - "towel"
        - "tableCloth"
        - "readyMadeGarment"
        - "electricCable"
        - "electricWire"
        - "fencingWire"
    requires:
      field: "finishedDimensions"
    validations:
      - id: "V-DIMENSIONS-PRESENT"
        type: "presence"
        field: "finishedDimensions"
        failAction: FAIL
      - id: "V-DIMENSIONS-COMPLETE"
        type: "compositeDimension"
        requiresComponents: ["length", "width"]
        optionalComponents: ["depth", "height"]
        failAction: UNCERTAIN
    severity: major
    reviewPolicy: onUncertain

  - id: "R6-2-CONSUMER-CARE"
    ruleReference: "Rule 6(2)"
    version: "2011.1"
    title: "Consumer care contact details"
    description: |
      Every package must bear the name, address, telephone number and,
      where available, e-mail address of the person or office that can
      be contacted for consumer complaints.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
      productCategory: "any"
    exemptWhen:
      applicabilityId: "APL-R26-A-SMALL-PACK"
    requires:
      anyOf:
        - field: "customerCare"
        - field: "customerCarePhone"
        - field: "customerCareEmail"
        - field: "customerCareAddress"
    validations:
      - id: "V-CONSUMER-CARE-PRESENT"
        type: "presence"
        fields: ["customerCare|customerCarePhone|customerCareEmail"]
        failAction: UNCERTAIN
      - id: "V-CONSUMER-CARE-CHANNELS"
        type: "atLeastOneOf"
        channels: ["phone", "email", "address"]
        failAction: UNCERTAIN
    severity: major
    reviewPolicy: onUncertain

  - id: "R6-3-NO-DECLARATION-STICKER"
    ruleReference: "Rule 6(3)"
    version: "2011.1"
    title: "Stickers altering declarations prohibited (MRP-lowering exception)"
    description: |
      Affixing stickers that alter or replace required declarations is
      prohibited. Exception: a sticker lowering the MRP (with revised
      lower MRP, inclusive of all taxes) may be affixed, provided it
      does not cover the original MRP declaration.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    requires:
      field: "stickerSuspects"
    validations:
      - id: "V-STICKER-OVER-REQUIRED-FIELD"
        type: "regionOverlapCheck"
        overlappingField: "mrp|netQuantity|manufacturedDate|manufacturer"
        failAction: UNCERTAIN
      - id: "V-MRP-STICKER-LOWER-ONLY"
        type: "priceComparison"
        primaryField: "mrp"
        stickerField: "mrpSticker"
        allowedRelation: "stickerLtePrimary"
        failAction: FAIL
    severity: major
    reviewPolicy: always
    tags: ["sticker", "alteration", "MRP-revision"]

  # =======================================================================
  # RULE 7 — Principal Display Panel
  # =======================================================================

  - id: "R7-1-PDP-5CC"
    ruleReference: "Rule 7(1)"
    version: "2011.1"
    title: "PDP for packages ≤ 5 cm³"
    description: |
      For packages with capacity 5 cm³ or less, the principal display
      panel may be a card or tape affixed firmly to the package.
    appliesWhen:
      packageCapacityAtMost: { value: 5, unit: "cm3" }
    validations:
      - id: "V-PDP-CARD-PRESENT"
        type: "presence"
        field: "pdpType"
        allowedValues: ["card", "tape", "packageSurface"]
        failAction: UNCERTAIN
    severity: minor
    reviewPolicy: onUncertain

  - id: "R7-2-PDP-NUMERAL-HEIGHT-WEIGHT-VOLUME"
    ruleReference: "Rule 7(2)(i)"
    version: "2011.1"
    title: "PDP numeral height (weight or volume) — Table I"
    description: |
      Minimum height of numerals for net quantity declared in weight or
      volume, per Table I.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
      netQuantityMeasuredBy: ["weight", "volume"]
    requires:
      field: "netQuantityNumeralHeightMm"
    validations:
      - id: "V-NUMERAL-HEIGHT-WEIGHT-VOLUME"
        type: "thresholdLookup"
        field: "netQuantityNumeralHeightMm"
        lookupBy: "netQuantityValue|netQuantityUnit"
        table:
          - whenQuantityAtMost: { value: 200, unit: "g_or_ml" }
            minHeightMm: { normal: 1, blownOrMolded: 2 }
          - whenQuantityBetween: { low: { value: 200, unit: "g_or_ml" }, high: { value: 500, unit: "g_or_ml" } }
            minHeightMm: { normal: 2, blownOrMolded: 4 }
          - whenQuantityAbove: { value: 500, unit: "g_or_ml" }
            minHeightMm: { normal: 4, blownOrMolded: 6 }
        failAction: FAIL
        uncertainIfMeasurementUncalibrated: true
    severity: major
    reviewPolicy: onUncertain

  - id: "R7-2-PDP-NUMERAL-HEIGHT-LENGTH-AREA-NUMBER"
    ruleReference: "Rule 7(2)(ii)"
    version: "2011.1"
    title: "PDP numeral height (length, area, or number) — Table II"
    description: |
      Minimum height of numerals for net quantity declared in length,
      area or number, based on PDP area.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
      netQuantityMeasuredBy: ["length", "area", "number"]
    requires:
      field: "netQuantityNumeralHeightMm"
    validations:
      - id: "V-NUMERAL-HEIGHT-LENGTH-AREA-NUMBER"
        type: "thresholdLookup"
        field: "netQuantityNumeralHeightMm"
        lookupBy: "pdpAreaCm2"
        table:
          - whenPdpAreaAtMostCm2: 100
            minHeightMm: { normal: 1, blownOrMolded: 2 }
          - whenPdpAreaBetweenCm2: { low: 100, high: 500 }
            minHeightMm: { normal: 2, blownOrMolded: 4 }
          - whenPdpAreaBetweenCm2: { low: 500, high: 2500 }
            minHeightMm: { normal: 4, blownOrMolded: 6 }
          - whenPdpAreaAboveCm2: 2500
            minHeightMm: { normal: 6, blownOrMolded: 6 }
        failAction: FAIL
        uncertainIfMeasurementUncalibrated: true
    severity: major
    reviewPolicy: onUncertain

  - id: "R7-3-PDP-LETTER-HEIGHT"
    ruleReference: "Rule 7(3)"
    version: "2011.1"
    title: "PDP letter height and aspect"
    description: |
      Height of letters must be ≥ 1 mm in normal case, ≥ 2 mm when
      blown, formed, molded, embossed or perforated. Width of any letter
      or numeral ≥ 1/3 of its height, except numeral "1" and letters
      "i", "I", "l".
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    requires:
      field: "letterHeightMm"
    validations:
      - id: "V-LETTER-HEIGHT-MIN"
        type: "numericMin"
        field: "letterHeightMm"
        minValue: 1
        failAction: FAIL
        uncertainIfMeasurementUncalibrated: true
      - id: "V-LETTER-HEIGHT-MIN-BLOWN"
        type: "numericMin"
        field: "letterHeightMm"
        minValue: 2
        when: "packageSurfaceMethodBlownFormedMoldedEmbossedPerforated"
        failAction: FAIL
      - id: "V-LETTER-ASPECT"
        type: "ratioMin"
        numeratorField: "letterWidthMm"
        denominatorField: "letterHeightMm"
        minRatio: 0.3333
        exclusions: ["numeral1", "letterI", "letterILower", "letterLLower"]
        failAction: UNCERTAIN
    severity: major
    reviewPolicy: onUncertain

  - id: "R7-4-PDP-OVERRIDE"
    ruleReference: "Rule 7(4)"
    version: "2011.1"
    title: "PDP font-size requirements suspended where other law applies"
    description: |
      Rule 7(1)–(3) do not apply where the same information must be
      specified under any other law in force.
    appliesWhen:
      otherLawApplies: true
    outcome: NOT_APPLICABLE

  # =======================================================================
  # RULE 8 — Placement
  # =======================================================================

  - id: "R8-1-PDP-PLACEMENT"
    ruleReference: "Rule 8(1)"
    version: "2011.1"
    title: "Declarations must appear on PDP with quantity clearance"
    description: |
      Every required declaration must appear on the principal display
      panel. The area surrounding the quantity declaration must be free
      from printed information: above and below at least the height of
      the numeral; left and right at least twice that height.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    requires:
      field: "declarationOnPdp"
    validations:
      - id: "V-ON-PDP"
        type: "presence"
        field: "declarationOnPdp"
        failAction: UNCERTAIN
      - id: "V-QUANTITY-CLEARANCE"
        type: "clearanceCheck"
        declaration: "netQuantity"
        clearSpaceMm:
          above: "numeralHeight"
          below: "numeralHeight"
          left:  "2 * numeralHeight"
          right: "2 * numeralHeight"
        failAction: UNCERTAIN
        uncertainIfMeasurementUncalibrated: true
    severity: major
    reviewPolicy: onUncertain

  - id: "R8-2-RETURNABLE-BOTTLE-PRICE"
    ruleReference: "Rule 8(2)"
    version: "2011.1"
    title: "Retail price on crown cap or bottle for returnable bottles"
    description: |
      For soft drinks, ready-to-serve fruit beverages and similar
      returnable bottles, retail sale price may be printed on the crown
      cap, the bottle, or both.
    appliesWhen:
      packageType: ["returnableBottle"]
      commodityTypeMatches: ["softDrink", "fruitBeverage"]
    validations:
      - id: "V-PRICE-ON-CAP-OR-BOTTLE"
        type: "presenceAny"
        fields: ["crownCapPrice", "bottlePrice", "packagePrice"]
        failAction: UNCERTAIN
    severity: minor
    reviewPolicy: onUncertain

  # =======================================================================
  # RULE 9 — Manner of declarations
  # =======================================================================

  - id: "R9-1-MANNER"
    ruleReference: "Rule 9(1)"
    version: "2011.1"
    title: "Declarations must be legible and prominent"
    description: |
      Every declaration must be legible and prominent. MRP and net
      quantity numerals must be printed in a colour contrasting with
      the label background.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    validations:
      - id: "V-MRP-CONTRAST"
        type: "colourContrast"
        declarationField: "mrpRegionBbox"
        backgroundField: "backgroundColourSample"
        minContrastRatio: 3.0
        failAction: UNCERTAIN
    severity: minor
    reviewPolicy: onUncertain

  - id: "R9-2-NOT-THROUGH-LIQUID"
    ruleReference: "Rule 9(2)"
    version: "2011.1"
    title: "Declarations must not require reading through liquid"
    description: |
      No declaration shall be made so as to require it to be read
      through any liquid commodity contained in the package.
    appliesWhen:
      containsLiquid: true
    validations:
      - id: "V-NOT-THROUGH-LIQUID"
        type: "manualReview"
        failAction: UNCERTAIN
    severity: minor
    reviewPolicy: onUncertain

  - id: "R9-3-OUTER-WRAPPER"
    ruleReference: "Rule 9(3)"
    version: "2011.1"
    title: "Outer container must bear declarations"
    description: |
      Where a package has an outside container or wrapper, the outer
      container must also bear all required declarations, unless the
      outer container is transparent and the declarations on the inner
      package are easily readable through it.
    appliesWhen:
      hasOuterWrapper: true
    validations:
      - id: "V-OUTER-DECLARATIONS"
        type: "presence"
        field: "outerWrapperDeclarations"
        failAction: FAIL
      - id: "V-OUTER-TRANSPARENT-EXCEPTION"
        type: "boolean"
        field: "outerWrapperTransparent"
        ifTrue: skipRule
    severity: major
    reviewPolicy: onUncertain

  - id: "R9-4-LANGUAGE"
    ruleReference: "Rule 9(4)"
    version: "2011.1"
    title: "Declarations in Hindi (Devanagari) or English"
    description: |
      Declarations must be in Hindi (Devanagari script) or English.
      Other languages may be used in addition.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    validations:
      - id: "V-LANGUAGE"
        type: "languageMembership"
        field: "declarationLanguage"
        allowed: ["hi", "en"]
        failAction: FAIL
    severity: major
    reviewPolicy: onUncertain

  # =======================================================================
  # RULE 10 — Manufacturer name and address
  # =======================================================================

  - id: "R10-1-FULL-ADDRESS"
    ruleReference: "Rule 10(1)"
    version: "2011.1"
    title: "Full address of manufacturer / packer / importer"
    description: |
      Every package must conspicuously bear the name and complete
      address of the manufacturer, or where the manufacturer is not the
      packer, of both manufacturer and packer; imported packages must
      bear the importer's name and address.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    exemptWhen:
      packageCapacityAtMost: { value: 5, unit: "cm3" }
    requires:
      field: "manufacturerAddress|packerAddress|importerAddress"
    validations:
      - id: "V-ADDRESS-PRESENT"
        type: "presence"
        fields: ["manufacturerAddress|packerAddress|importerAddress"]
        failAction: FAIL
      - id: "V-ADDRESS-COMPLETE"
        type: "compositeAddress"
        requiresComponents: ["premisesNumberOrStreet", "cityOrDistrict", "stateOrUt"]
        optionalComponents: ["pinCode"]
        onMissingOptional: PASS
        onMissingCritical: UNCERTAIN
    severity: critical
    reviewPolicy: onUncertain
    notes: |
      Rule 10 Explanation: "complete address" means the postal address
      where the factory is situated, and in other cases the street name,
      number assigned to the premises, city and state, plus PIN code.

  - id: "R10-1-PROVISO-5CC-MARK"
    ruleReference: "Rule 10(1) proviso"
    version: "2011.1"
    title: "Small packages ≤ 5 cm³ may bear a mark/inscription"
    description: |
      For packages of capacity 5 cm³ or less, a mark or inscription
      sufficient to identify the manufacturer/packer/importer is enough.
    appliesWhen:
      packageCapacityAtMost: { value: 5, unit: "cm3" }
    validations:
      - id: "V-MARK-PRESENT"
        type: "presence"
        field: "identifyingMarkOrInscription"
        failAction: UNCERTAIN
    severity: minor
    reviewPolicy: onUncertain

  - id: "R10-1-PROVISO-REPACKED-IMPORT"
    ruleReference: "Rule 10(1) second proviso"
    version: "2011.1"
    title: "Foreign-manufactured, India-packed — packer/importer on PDP"
    description: |
      Where a commodity manufactured outside India is packed in India,
      the package must also bear on the PDP the name and complete
      address of the packer or the importer in India.
    appliesWhen:
      allOf:
        - manufacturedOutsideIndia: true
        - packedInIndia: true
    requires:
      field: "packerAddress|importerAddress"
    validations:
      - id: "V-PACKER-IMPORTER-ON-PDP"
        type: "presenceOnPdp"
        fields: ["packerAddress|importerAddress"]
        failAction: FAIL
    severity: major
    reviewPolicy: onUncertain

  - id: "R10-2-CORPORATE-NAME"
    ruleReference: "Rule 10(2)"
    version: "2011.1"
    title: "Name must be actual corporate name or business name"
    description: |
      The manufacturer/packer/importer name must be the actual corporate
      name, or if not incorporated, the name under which the business is
      conducted in India.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    validations:
      - id: "V-CORPORATE-NAME-FORM"
        type: "regex"
        field: "manufacturer|packer|importer"
        pattern: "(?i)(pvt\\.?\\s*ltd|private\\s+limited|\\bltd\\b|limited|llp|inc\\.?|corp\\.?)"
        missingPatternAction: UNCERTAIN
    severity: minor
    reviewPolicy: onUncertain

  # =======================================================================
  # RULE 11 — General provisions on quantity
  # =======================================================================

  - id: "R11-1-EXCLUDE-WRAPPER"
    ruleReference: "Rule 11(1)"
    version: "2011.1"
    title: "Net quantity excludes wrapper and packaging weight"
    description: |
      In declaring net quantity, the weight of wrappers and other
      packaging materials must be excluded.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    validations:
      - id: "V-NET-QTY-EXCLUDES-WRAPPER"
        type: "documentedExclusion"
        field: "netQuantityValue"
        failAction: UNCERTAIN
    severity: minor
    reviewPolicy: onUncertain

  - id: "R11-2-NO-WHEN-PACKED"
    ruleReference: "Rule 11(2)"
    version: "2011.1"
    title: "Quantity declaration not qualified by 'when packed'"
    description: |
      Where a commodity is not likely to undergo variations in weight
      or measure due to environmental conditions, the declared quantity
      must not be qualified by the words "when packed" or similar.
    appliesWhen:
      commodityTypeNotIn: ["soap", "lotion", "cream"]
    validations:
      - id: "V-NO-WHEN-PACKED-PHRASE"
        type: "forbiddenSubstring"
        field: "netQuantityRawText"
        forbidden: ["when packed", "when-pack"]
        failAction: FAIL
    severity: major
    reviewPolicy: onUncertain

  - id: "R11-4-WHEN-PACKED-ALLOWED"
    ruleReference: "Rule 11(4)"
    version: "2011.1"
    title: "'When packed' qualifier required for specified commodities"
    description: |
      For commodities in the Third Schedule, the quantity declaration
      must be qualified by the words "when packed".
    appliesWhen:
      commodityTypeIn: ["soap", "lotion", "cream"]
    validations:
      - id: "V-WHEN-PACKED-REQUIRED"
        type: "requiredSubstring"
        field: "netQuantityRawText"
        required: "when packed"
        failAction: UNCERTAIN
    severity: minor
    reviewPolicy: onUncertain

  # =======================================================================
  # RULE 12 — Manner of quantity declaration
  # =======================================================================

  - id: "R12-1-ADEQUATE-UNIT"
    ruleReference: "Rule 12(1)"
    version: "2011.1"
    title: "Quantity expressed in adequate and accurate unit"
    description: |
      The quantity declaration must be expressed in terms of such units
      of weight, measure or number as give accurate and adequate
      information about the quantity to the consumer.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    validations:
      - id: "V-UNIT-ADEQUATE"
        type: "unitDomain"
        field: "netQuantityUnit"
        failAction: UNCERTAIN
    severity: minor
    reviewPolicy: onUncertain

  - id: "R12-2-CORRECT-UNIT-FAMILY"
    ruleReference: "Rule 12(2)"
    version: "2011.1"
    title: "Quantity declared in correct unit family"
    description: |
      Except for commodities listed in the Fourth Schedule, quantity
      must be in mass (solid/semi-solid/viscous/mixture), length (linear
      measure), area (area measure), volume (liquid or cubic measure),
      or number.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    exemptWhen:
      commodityTypeInFourthSchedule: true
    validations:
      - id: "V-UNIT-FAMILY-MATCH"
        type: "unitFamilyConsistency"
        stateField: "commodityPhysicalState"
        unitField: "netQuantityUnit"
        mapping:
          solid:                ["g", "kg", "mg"]
          semiSolid:            ["g", "kg"]
          viscous:              ["g", "kg", "ml", "l"]
          liquid:               ["ml", "l"]
          solidAndLiquidMix:    ["g", "kg", "ml", "l"]
          linear:               ["mm", "cm", "m"]
          area:                 ["cm2", "dm2", "m2"]
          count:                ["N", "U"]
        failAction: FAIL
    severity: major
    reviewPolicy: onUncertain

  - id: "R12-6-NO-MISLEADING-QUALIFIER"
    ruleReference: "Rule 12(6)"
    version: "2011.1"
    title: "No misleading qualifiers in quantity declaration"
    description: |
      Quantity declaration must not contain words creating an
      exaggerated, misleading or inadequate impression.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    validations:
      - id: "V-NO-MISLEADING-WORDS"
        type: "forbiddenSubstring"
        field: "netQuantityRawText"
        caseInsensitive: true
        forbidden:
          - "minimum"
          - "not less than"
          - "average"
          - "about"
          - "approximately"
          - "approx"
          - "approx."
          - "more or less"
        failAction: FAIL
    severity: major
    reviewPolicy: onUncertain

  - id: "R12-7-SMALL-PACKAGE-TAG"
    ruleReference: "Rule 12(7)"
    version: "2011.1"
    title: "Quantity on tag/card/tape for packages ≤ 5 cm³"
    description: |
      For packages of capacity 5 cm³ or less, the quantity declaration
      must appear on a tag, card, tape or similar device affixed so it
      cannot be removed without opening the container.
    appliesWhen:
      packageCapacityAtMost: { value: 5, unit: "cm3" }
    validations:
      - id: "V-TAG-PRESENT"
        type: "presence"
        field: "quantityTagOrCard"
        failAction: UNCERTAIN
    severity: minor
    reviewPolicy: onUncertain

  # =======================================================================
  # RULE 13 — Units
  # =======================================================================

  - id: "R13-2-3-UNIT-SELECTION"
    ruleReference: "Rule 13(2)-(3)"
    version: "2011.1"
    title: "Correct unit selection by magnitude"
    description: |
      Below one kg → gram; below one metre → centimetre; below one m²
      → dm²; below one m³ / one cubic decimetre → cm³; below one litre
      → millilitre. At or above thresholds, use the larger unit.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    validations:
      - id: "V-UNIT-MAGNITUDE"
        type: "unitMagnitudeMatch"
        rules:
          - { unitFamily: "mass",   threshold: { value: 1, unit: "kg" }, below: "g",  atOrAbove: "kg" }
          - { unitFamily: "length", threshold: { value: 1, unit: "m"  }, below: "cm", atOrAbove: "m"  }
          - { unitFamily: "area",   threshold: { value: 1, unit: "m2" }, below: "dm2", atOrAbove: "m2" }
          - { unitFamily: "volume", threshold: { value: 1, unit: "l"  }, below: "ml", atOrAbove: "l"  }
        failAction: UNCERTAIN
    severity: minor
    reviewPolicy: onUncertain

  - id: "R13-4-NO-DOZEN-SCORE"
    ruleReference: "Rule 13(4)"
    version: "2011.1"
    title: "No dozen, score, gross, great gross"
    description: |
      No number called the dozen, score, gross, great gross or the like
      shall be specified or indicated on any package.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    validations:
      - id: "V-NO-DOZEN-SCORE"
        type: "forbiddenSubstring"
        field: "netQuantityRawText"
        caseInsensitive: true
        forbidden: ["dozen", "score", "gross", "great gross", "doz"]
        failAction: FAIL
    severity: major
    reviewPolicy: onUncertain

  - id: "R13-5-SYMBOLS"
    ruleReference: "Rule 13(5)"
    version: "2011.1"
    title: "SI unit symbols; N or U for count"
    description: |
      Only SI units and their symbols shall be used for net quantity.
      Items sold by number must use symbol N or U.
    appliesWhen:
      saleType: ["retail", "ecommerce"]
    validations:
      - id: "V-SI-UNIT-SYMBOLS"
        type: "unitMembership"
        field: "netQuantityUnit"
        allowedSymbols:
          mass:   ["g", "kg", "mg"]
          volume: ["ml", "l"]
          length: ["mm", "cm", "m"]
          area:   ["cm2", "dm2", "m2"]
          number: ["N", "U"]
        rejectSymbols:
          - "lbs"
          - "oz"
          - "ft"
          - "inch"
          - "in"
          - "yd"
          - "gal"
          - "qt"
        failAction: FAIL
    severity: major
    reviewPolicy: onUncertain

  # =======================================================================
  # RULE 14 — Dimensions of specific commodities
  # =======================================================================

  - id: "R14-DIMENSIONS"
    ruleReference: "Rule 14"
    version: "2011.1"
    title: "Dimensions of finished-size commodities"
    description: |
      Packages containing bed-sheets, hemmed fabric, dhoties, sarees,
      napkins, pillow-covers, towels, table cloths or similar items must
      declare the number and dimensions of the finished size.
    appliesWhen:
      commodityTypeIn:
        - "bedSheet"
        - "hemmedFabric"
        - "dhoti"
        - "saree"
        - "napkin"
        - "pillowCover"
        - "towel"
        - "tableCloth"
    requires:
      field: "finishedDimensions"
    validations:
      - id: "V-FINISHED-DIM-PRESENT"
        type: "presence"
        field: "finishedDimensions"
        failAction: FAIL
      - id: "V-PIECE-LEVEL-DIM-PRESENT"
        type: "presenceIfCondition"
        condition: "packageContainsMultiplePiecesOfDifferentDimensions"
        field: "perPieceDimensionsAndMrp"
        failAction: FAIL
    severity: major
    reviewPolicy: onUncertain

  # =======================================================================
  # RULE 15 — Dimensions and weight where price-related
  # =======================================================================

  - id: "R15-DIM-WEIGHT-PRICE"
    ruleReference: "Rule 15"
    version: "2011.1"
    title: "Dimensions/weight declared where related to price"
    description: |
      Where dimensions, weight, or both relate to the price of the
      commodity, the quantity declaration must also include such
      dimensions, weight or combination.
    appliesWhen:
      dimensionsOrWeightAffectPrice: true
    validations:
      - id: "V-DIM-WEIGHT-DECLARED"
        type: "presence"
        field: "dimensionsAndWeightDeclaration"
        failAction: FAIL
    severity: major
    reviewPolicy: onUncertain

  # =======================================================================
  # RULE 16 — Number of usable sheets
  # =======================================================================

  - id: "R16-USABLE-SHEETS"
    ruleReference: "Rule 16"
    version: "2011.1"
    title: "Number and dimensions of usable sheets"
    description: |
      Packages containing aluminium foil, facial tissue, waxed paper,
      toilet paper or similar sheet products must declare the number
      of usable sheets and dimensions of each sheet.
    appliesWhen:
      commodityTypeIn:
        - "aluminiumFoil"
        - "facialTissue"
        - "waxedPaper"
        - "toiletPaper"
        - "sheetProduct"
    requires:
      allOf:
        - field: "usableSheetsCount"
        - field: "sheetDimensions"
    validations:
      - id: "V-SHEETS-PRESENT"
        type: "presence"
        fields: ["usableSheetsCount", "sheetDimensions"]
        failAction: FAIL
    severity: major
    reviewPolicy: onUncertain

  # =======================================================================
  # RULE 17 — Container-type commodities
  # =======================================================================

  - id: "R17-CONTAINER-DECLARATIONS"
    ruleReference: "Rule 17"
    version: "2011.1"
    title: "Declarations for container-type commodities"
    description: |
      Commodities sold as containers (bags, boxes, cups, pans, etc.)
      must be labelled with quantity and dimensions per shape category.
    appliesWhen:
      commodityTypeIn:
        - "bagType"
        - "boxType"
        - "cupType"
        - "panType"
        - "containerType"
    validations:
      - id: "V-BAG-TYPE"
        when: "commodityType == 'bagType'"
        type: "presence"
        fields: ["numberOfBags", "linearDimensions"]
        failAction: FAIL
      - id: "V-BOX-TYPE"
        when: "commodityType == 'boxType'"
        type: "presence"
        fields: ["numberOfContainers", "length", "width"]
        optional: ["depth"]
        failAction: FAIL
      - id: "V-CUP-TYPE"
        when: "commodityType == 'cupType'"
        type: "presence"
        fields: ["numberOfCommodities", "diameter"]
        optional: ["depth"]
        failAction: FAIL
    severity: major
    reviewPolicy: onUncertain

  # =======================================================================
  # RULE 18 — Wholesale / retail dealers
  # =======================================================================

  - id: "R18-2-NO-SALE-ABOVE-MRP"
    ruleReference: "Rule 18(2)"
    version: "2011.1"
    title: "No sale above MRP"
    description: |
      No retail dealer or other person (including manufacturer, packer,
      importer, wholesale dealer) shall sell any commodity in packed
      form at a price exceeding the retail sale price.
    appliesWhen:
      transactionSalePriceKnown: true
    validations:
      - id: "V-SALE-PRICE-LTE-MRP"
        type: "numericCompare"
        lhsField: "transactionSalePrice"
        rhsField: "mrp"
        relation: "<="
        failAction: FAIL
    severity: critical
    reviewPolicy: onFail

  - id: "R18-5-NO-MRP-OBLITERATION"
    ruleReference: "Rule 18(5)"
    version: "2011.1"
    title: "No obliteration or alteration of MRP on label"
    description: |
      No wholesale dealer, retail dealer or other person shall
      obliterate, smudge or alter the retail sale price indicated on
      the package or on its label.
    appliesWhen:
      saleType: ["retail", "wholesale", "ecommerce"]
    validations:
      - id: "V-MRP-NOT-OBLITERATED"
        type: "regionAlterationCheck"
        field: "mrpRegionBbox"
        failAction: UNCERTAIN
    severity: major
    reviewPolicy: always

  - id: "R18-7-ELECTRONIC-WEIGHING-MACHINE"
    ruleReference: "Rule 18(7)"
    version: "2011.1"
    title: "Electronic weighing machine at retail premises"
    description: |
      Retailers under VAT/TOT selling packaged commodities by weight or
      volume must maintain an electronic weighing machine of at least
      accuracy class III, smallest division 1 g, with printed-receipt
      facility, at a prominent place, free for consumers.
    appliesWhen:
      saleType: "retail"
      retailerRegisteredUnderVatOrTot: true
    validations:
      - id: "V-WEIGHING-MACHINE-PRESENT"
        type: "premisesEquipmentCheck"
        failAction: UNCERTAIN
    severity: minor
    reviewPolicy: always

  # =======================================================================
  # RULE 24 — Wholesale packages
  # =======================================================================

  - id: "R24-WHOLESALE-DECLARATIONS"
    ruleReference: "Rule 24"
    version: "2011.1"
    title: "Wholesale package declarations"
    description: |
      Every wholesale package must bear a legible, definite, plain and
      conspicuous declaration of: (a) manufacturer/importer name and
      address, or where not the packer, of the packer; (b) identity of
      the commodity; (c) total number of retail packages contained, or
      net quantity in standard units.
    appliesWhen:
      saleType: "wholesale"
    requires:
      anyOf:
        - field: "manufacturer"
        - field: "importer"
        - field: "packer"
    validations:
      - id: "V-WHOLESALE-MFG-PRESENT"
        type: "presence"
        fields: ["manufacturer|importer|packer"]
        failAction: FAIL
      - id: "V-WHOLESALE-IDENTITY"
        type: "presence"
        field: "commodityIdentity"
        failAction: FAIL
      - id: "V-WHOLESALE-COUNT-OR-QTY"
        type: "presenceAny"
        fields: ["totalRetailPackageCount", "netQuantityValue"]
        failAction: FAIL
    severity: major
    reviewPolicy: onUncertain

  # =======================================================================
  # RULE 25 — Export packages
  # =======================================================================

  - id: "R25-EXPORT-REPACK"
    ruleReference: "Rule 25"
    version: "2011.1"
    title: "Export packages must be repacked/relabelled before Indian sale"
    description: |
      An export package shall not be sold in India unless the
      manufacturer/packer has re-packed or re-labelled it in accordance
      with Chapter II.
    appliesWhen:
      allOf:
        - originallyMarkedExport: true
        - beingSoldInIndia: true
    validations:
      - id: "V-REPACK-EVIDENCE"
        type: "presence"
        field: "repackOrRelabelEvidence"
        failAction: FAIL
    severity: critical
    reviewPolicy: onFail
    notes: |
      When isExportOnly is true and sale is domestic retail, this rule
      applies. An export-marked package sold domestically without repack
      evidence is a Rule 25 violation.

  # =======================================================================
  # RULE 31 — Advertisements
  # =======================================================================

  - id: "R31-ADVERTISEMENT-NET-QUANTITY"
    ruleReference: "Rule 31(1)"
    version: "2011.1"
    title: "Advertisement with retail price must declare net quantity"
    description: |
      Any advertisement mentioning the retail sale price of a
      pre-packaged commodity must also contain a declaration of net
      quantity or number of commodities contained in the package.
    appliesWhen:
      saleType: "ecommerce"
      advertisementMentionsPrice: true
    validations:
      - id: "V-AD-NET-QTY-PRESENT"
        type: "presence"
        field: "advertisementNetQuantity"
        failAction: FAIL
    severity: major
    reviewPolicy: onFail

  - id: "R31-2-FONT-SIZE-EQUALITY"
    ruleReference: "Rule 31(2)"
    version: "2011.1"
    title: "Net quantity font size in advertisement equals retail price"
    description: |
      The font size of the net quantity in an advertisement must equal
      that of the retail sale price.
    appliesWhen:
      saleType: "ecommerce"
      advertisementMentionsPrice: true
    validations:
      - id: "V-FONT-SIZE-EQUAL"
        type: "numericRatioEqual"
        lhsField: "advertisementNetQuantityFontHeightMm"
        rhsField: "advertisementPriceFontHeightMm"
        tolerance: 0.15
        failAction: UNCERTAIN
    severity: minor
    reviewPolicy: onUncertain

# =========================================================================
# CROSS-FIELD / CHRONOLOGY RULES
# =========================================================================

crossFieldRules:

  - id: "XR-CHRONOLOGY-MFG-EXP"
    title: "Manufacturing date must not be after expiry date"
    fields: ["manufacturedDate|packedDate", "expiryDate"]
    validations:
      - id: "V-CHRON-MFG-LTE-EXP"
        type: "dateCompare"
        relation: "lte"
        failAction: FAIL
    severity: critical
    reviewPolicy: onFail

  - id: "XR-CHRONOLOGY-MFG-NOT-TOO-OLD"
    title: "Manufacturing date is implausibly old"
    fields: ["manufacturedDate|packedDate"]
    validations:
      - id: "V-CHRON-MFG-AGE"
        type: "dateDeltaMax"
        reference: "inspectionDate"
        maxYears: 5
        failAction: UNCERTAIN
    severity: major
    reviewPolicy: onUncertain

  - id: "XR-CHRONOLOGY-EXPIRY-NOT-PAST"
    title: "Expiry date is in the past"
    fields: ["expiryDate"]
    validations:
      - id: "V-CHRON-EXP-FUTURE"
        type: "dateCompare"
        compareTo: "inspectionDate"
        relation: "gte"
        failAction: UNCERTAIN
        note: |
          An expired product is not automatically a legal breach — the
          pack was compliant at time of manufacture. Flag for review.
    severity: minor
    reviewPolicy: onUncertain

  - id: "XR-PRICE-VS-NET-QUANTITY"
    title: "MRP and net quantity must be internally consistent"
    validations:
      - id: "V-UNIT-PRICE-CONSISTENT"
        type: "derivedCheck"
        derivedFrom:
          mrp: "mrp"
          quantity: "netQuantityValue"
          unit: "netQuantityUnit"
          declaredUnitPrice: "unitSalePrice"
        failAction: UNCERTAIN
    severity: major
    reviewPolicy: onUncertain

# =========================================================================
# VERIFICATION ADAPTERS (external authority lookups)
# =========================================================================

verification:

  - id: "VER-FSSAI"
    authority: "FSSAI"
    appliesWhen:
      productCategory: "food"
      fieldPresent: "fssaiLicense"
    adapter: "fssaiLicenseStructural"
    expectedFormat: "^\\d{14}$"
    onMismatch: UNCERTAIN
    onUnavailable: API_UNAVAILABLE
    notes: |
      Structural validation only. Live lookup requires FSSAI FoSCoS API
      credentials not currently provisioned.

  - id: "VER-GSTIN"
    authority: "GST"
    appliesWhen:
      fieldPresent: "gstin"
    adapter: "gstinStructural"
    expectedFormat: "^\\d{2}[A-Z]{5}\\d{4}[A-Z]{1}[A-Z\\d]{1}[Z]{1}[A-Z\\d]{1}$"
    onMismatch: UNCERTAIN
    onUnavailable: API_UNAVAILABLE

  - id: "VER-BIS"
    authority: "BIS"
    appliesWhen:
      productCategory: ["industrial", "household"]
      fieldPresent: "bisLicense"
    adapter: "bisLookup"
    onUnavailable: API_UNAVAILABLE
    notes: "BIS ISI-mark verification API not yet integrated."

# =========================================================================
# SCHEDULES
# =========================================================================

schedules:

  # -----------------------------------------------------------------------
  # FIRST SCHEDULE — Maximum Permissible Errors (Rule 2(e))
  # -----------------------------------------------------------------------
  firstSchedule:
    title: "Maximum Permissible Error"
    reference: "Rule 2(e), First Schedule"
    maximumPermissibleError:
      byWeightOrVolume:
        reference: "Table I"
        bands:
          - declaredQuantity: { min: 0,     max: 50,    inclusive: true,      unit: "g_or_ml" }
            errorPercent: 9
          - declaredQuantity: { min: 50,    max: 100,   inclusive: "minOnly", unit: "g_or_ml" }
            errorValue: 4.5
            errorUnit: "g_or_ml"
          - declaredQuantity: { min: 100,   max: 200,   inclusive: true,      unit: "g_or_ml" }
            errorPercent: 4.5
          - declaredQuantity: { min: 200,   max: 300,   inclusive: "minOnly", unit: "g_or_ml" }
            errorValue: 9
            errorUnit: "g_or_ml"
          - declaredQuantity: { min: 300,   max: 500,   inclusive: true,      unit: "g_or_ml" }
            errorPercent: 3
          - declaredQuantity: { min: 500,   max: 1000,  inclusive: "minOnly", unit: "g_or_ml" }
            errorValue: 15
            errorUnit: "g_or_ml"
          - declaredQuantity: { min: 1000,  max: 10000, inclusive: true,      unit: "g_or_ml" }
            errorPercent: 1.5
          - declaredQuantity: { min: 10000, max: 15000, inclusive: "minOnly", unit: "g_or_ml" }
            errorValue: 150
            errorUnit: "g_or_ml"
          - declaredQuantity: { min: 15000, max: null,                        unit: "g_or_ml" }
            errorPercent: 1.0
      byLengthAreaOrNumber:
        reference: "Table II"
        bands:
          - declaredQuantity: { min: 0,   max: 100, inclusive: true, unit: "cm_or_number" }
            errorPercent: 10
          - declaredQuantity: { min: 100, max: 500, inclusive: true, unit: "cm_or_number" }
            errorPercent: 5
          - declaredQuantity: { min: 500, max: null,                 unit: "cm_or_number" }
            errorPercent: 2.5

  # -----------------------------------------------------------------------
  # SECOND SCHEDULE — Standard Package Quantities (Rule 5)
  # -----------------------------------------------------------------------
  secondSchedule:
    title: "Standard Package Quantities"
    reference: "Rule 5, Second Schedule"
    statusNote: |
      Rule 5 imposes standard pack sizes for listed commodities. Where
      an exemption exists (10g-20g / 10ml-20ml range), the standard size
      may be departed from provided the label prominently declares a
      non-standard pack size under the LMPC Rules, 2011.
    commodities:
      - id: "SS-BISCUITS"
        label: "Biscuits"
        unit: "g"
        standardSizes: [25, 50, 75, 100, 200, 250, 300]
        additionalPattern: { aboveG: 1000, stepG: 100 }
      - id: "SS-BREAD"
        label: "Bread"
        unit: "g"
        standardSizes: [100]
        additionalPattern: { aboveG: 100, stepG: 100 }
      - id: "SS-BUTTER_GHEE"
        label: "Butter / Margarine (tinned containers)"
        unit: "g"
        standardSizes: [25, 50, 100, 200, 300, 500, 1000, 2000, 5000]
      - id: "SS-CEREALS_PULSES"
        label: "Cereals and Pulses"
        unit: "g"
        standardSizes: [100, 200, 500, 1000, 2000, 5000]
        additionalPattern: { aboveG: 5000, stepG: 5000 }
      - id: "SS-COFFEE"
        label: "Coffee"
        unit: "g"
        standardSizes: [25, 50, 100, 200, 250, 500, 1000]
        additionalPattern: { aboveG: 1000, stepG: 1000 }
      - id: "SS-TEA"
        label: "Tea"
        unit: "g"
        standardSizes: [25, 50, 100, 125, 250, 500, 1000]
        additionalPattern: { aboveG: 1000, stepG: 1000 }
      - id: "SS-BEVERAGES"
        label: "Materials which may be constituted (beverages)"
        unit: "g"
        standardSizes: [25, 50, 100, 125, 200, 500, 1000]
        additionalPattern: { aboveG: 1000, stepG: 1000 }
      - id: "SS-EDIBLE_OILS"
        label: "Edible Oils, Vanaspati, Ghee, Butter Oil"
        unit: "ml_or_l"
        standardSizes: [50, 100, 200, 500, 1000, 2000, 3000, 5000]
        additionalPattern: { aboveValue: 5000, step: 5000 }
        note: "If declared by volume, weight equivalent must also appear in brackets, same size."
      - id: "SS-MILK_POWDER"
        label: "Milk Powder"
        unit: "g"
        standardSizes: [50, 100, 200, 500, 1000]
        belowValueNoRestriction: 50
        additionalPattern: { aboveG: 1000, stepG: 500 }
      - id: "SS-DETERGENTS_POWDER"
        label: "Non-soapy detergents (powder)"
        unit: "g"
        standardSizes: [50, 100, 200, 500, 700, 1000, 1500, 2000]
        belowValueNoRestriction: 50
        additionalPattern: { aboveG: 2000, stepG: 1000 }
      - id: "SS-RICE_FLOUR_ATTA_RAWA_SUJI"
        label: "Rice (powdered), Flour, Atta, Rawa, Suji"
        unit: "g"
        standardSizes: [100, 200, 500, 1000, 2000, 5000]
        additionalPattern: { aboveG: 5000, stepG: 5000 }
      - id: "SS-SALT"
        label: "Salt"
        unit: "g"
        standardSizes: [50, 100, 200, 500, 750, 1000, 2000, 5000]
        belowValuePattern: { belowG: 50, stepG: 10 }
        additionalPattern: { aboveG: 5000, stepG: 5000 }
      - id: "SS-LAUNDRY_SOAP"
        label: "Laundry Soap"
        unit: "g"
        standardSizes: [50, 75, 100]
        additionalPattern: { aboveG: 100, stepG: 50 }
      - id: "SS-NON_SOAPY_DETERGENT_CAKES"
        label: "Non-soapy detergent cakes / bars"
        unit: "g"
        standardSizes: [50, 75, 100, 125, 150, 200, 250, 300]
        additionalPattern: { aboveG: 300, stepG: 100 }
      - id: "SS-TOILET_SOAP"
        label: "Toilet Soap including all kinds of bath soap (cakes)"
        unit: "g"
        standardSizes: [25, 50, 75, 100, 125, 150]
        additionalPattern: { aboveG: 150, stepG: 50 }
      - id: "SS-AERATED_SOFT_DRINKS"
        label: "Aerated soft drinks, non-alcoholic beverages"
        unit: "ml"
        standardSizes: [100, 125, 150, 200, 250, 300, 330, 500, 750, 1000, 1500, 2000, 3000, 4000, 5000]
        note: "65 ml and 125 ml for fruit-based drinks only. 330 ml for cans only."
      - id: "SS-MINERAL_WATER"
        label: "Mineral water and packaged drinking water"
        unit: "ml"
        standardSizes: [100, 150, 200, 250, 300, 500, 750, 1000, 1500, 2000, 3000, 4000, 5000]
      - id: "SS-CEMENT"
        label: "Cement in bags"
        unit: "kg"
        standardSizes: [1000, 2000, 5000, 10000, 20000, 25000, 40000, 50000]
        note: "40 kg for white cement only."
      - id: "SS-PAINT_VARNISH"
        label: "Paint, varnish, varnish stains, enamels"
        categories:
          - subtype: "pastePaintOrSolidPaint"
            unit: "g"
            standardSizes: [500, 1000, 1500, 2000, 3000, 5000, 7000]
            additionalPattern: { aboveG: 5000, stepG: 5000 }
          - subtype: "basePaint"
            unit: "ml"
            standardSizes: [450, 500, 900, 925, 950, 975, 1000, 3600, 3700, 3800, 3900, 4000]
            note: "No restriction above 4 litre."
          - subtype: "otherPaintVarnish"
            unit: "ml"
            standardSizes: [50, 100, 200, 500, 1000, 2000, 3000, 4000, 5000]
            additionalPattern: { aboveMl: 5000, stepMl: 5000 }

  # -----------------------------------------------------------------------
